<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Dual-Spectral Neural Operator overview</title>
  <desc id="desc">A reconstructed overview of the Dual-Spectral Neural Operator, combining Fourier and wavelet spectral branches through dynamic fusion.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#edf4fb"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcfce7"/>
      <stop offset="1" stop-color="#bbf7d0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#64748b" flood-opacity=".16"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="650" rx="28" fill="url(#bg)"/>
  <text x="600" y="54" text-anchor="middle" fill="#17324d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">Dual-Spectral Neural Operator (DSNO)</text>
  <text x="600" y="84" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="15">Fourier and wavelet representations for partial differential equations</text>

  <g filter="url(#shadow)">
    <rect x="48" y="222" width="178" height="188" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="137" y="257" text-anchor="middle" fill="#17324d" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">PDE input</text>
    <text x="137" y="282" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="13">initial / boundary field</text>
    <g transform="translate(77 310)">
      <rect width="120" height="75" rx="7" fill="#e0f2fe"/>
      <path d="M0 21 C24 6 34 42 57 22 S91 9 120 28 M0 51 C23 36 38 67 59 47 S91 40 120 56" fill="none" stroke="#1683b5" stroke-width="4"/>
      <path d="M20 0 V75 M50 0 V75 M80 0 V75 M110 0 V75" stroke="#7dd3fc" stroke-width="1" opacity=".8"/>
      <path d="M0 18 H120 M0 42 H120 M0 63 H120" stroke="#7dd3fc" stroke-width="1" opacity=".8"/>
    </g>
  </g>

  <path d="M226 316 H284" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="255" y="300" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="12">encode</text>

  <g filter="url(#shadow)">
    <rect x="285" y="130" width="258" height="168" rx="18" fill="url(#blue)" stroke="#60a5fa" stroke-width="2"/>
    <text x="414" y="171" text-anchor="middle" fill="#17324d" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Fourier branch</text>
    <text x="414" y="198" text-anchor="middle" fill="#365d87" font-family="Arial, Helvetica, sans-serif" font-size="14">global spectral features</text>
    <rect x="329" y="225" width="170" height="43" rx="10" fill="#fff" opacity=".82"/>
    <text x="414" y="252" text-anchor="middle" fill="#2563eb" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Fourier transform</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="285" y="352" width="258" height="168" rx="18" fill="url(#violet)" stroke="#a78bfa" stroke-width="2"/>
    <text x="414" y="393" text-anchor="middle" fill="#17324d" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Wavelet branch</text>
    <text x="414" y="420" text-anchor="middle" fill="#66558d" font-family="Arial, Helvetica, sans-serif" font-size="14">local and multi-scale features</text>
    <rect x="329" y="447" width="170" height="43" rx="10" fill="#fff" opacity=".82"/>
    <text x="414" y="474" text-anchor="middle" fill="#7c3aed" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Wavelet transform</text>
  </g>

  <path d="M543 214 C600 214 600 283 650 283" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M543 436 C600 436 600 367 650 367" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="650" y="241" width="206" height="168" rx="18" fill="url(#green)" stroke="#4ade80" stroke-width="2"/>
    <text x="753" y="286" text-anchor="middle" fill="#17324d" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Dynamic fusion</text>
    <text x="753" y="314" text-anchor="middle" fill="#39714c" font-family="Arial, Helvetica, sans-serif" font-size="14">adaptive spectral mixing</text>
    <rect x="689" y="342" width="128" height="38" rx="9" fill="#fff" opacity=".84"/>
    <text x="753" y="367" text-anchor="middle" fill="#15803d" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">DSNO block</text>
  </g>

  <path d="M856 325 H918" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="920" y="222" width="230" height="188" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1035" y="257" text-anchor="middle" fill="#17324d" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">PDE solution</text>
    <text x="1035" y="282" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="13">predicted field evolution</text>
    <g transform="translate(956 310)">
      <rect width="158" height="75" rx="7" fill="#ecfccb"/>
      <path d="M0 58 C25 48 27 16 51 27 S82 65 105 40 S131 13 158 20" fill="none" stroke="#65a30d" stroke-width="4"/>
      <path d="M0 18 C24 4 34 37 56 22 S92 12 116 31 S143 46 158 40" fill="none" stroke="#84cc16" stroke-width="3" opacity=".75"/>
      <path d="M31 0 V75 M63 0 V75 M95 0 V75 M127 0 V75" stroke="#bef264" stroke-width="1"/>
      <path d="M0 22 H158 M0 47 H158" stroke="#bef264" stroke-width="1"/>
    </g>
  </g>

  <text x="600" y="600" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="13">Overview reconstructed from the paper's public method description</text>
</svg>
